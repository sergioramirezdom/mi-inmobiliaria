name: Automated Scraper Scheduler

on:
  # Every hour from 06:00 to 18:00 UTC (= 08:00 to 20:00 UTC+2)
  schedule:
    - cron: '0 6-18 * * *'

  # Allow manual trigger (with optional force flag)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar scraping aunque no haya pasado el intervalo'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV

      - name: Run scheduled scraper
        run: |
          mkdir -p logs
          echo "🚀 Starting automated scraper ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -u scripts/scheduler.py --once --results-per-page 48 $FORCE_FLAG
        timeout-minutes: 100

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "✅ Scraper run completed"
          if [ -f logs/scheduler.log ]; then
            echo "📊 Latest entries:"
            tail -20 logs/scheduler.log
          fi
