name: Sold Properties Check

on:
  # Once daily at 10:00 UTC (= 12:00 UTC+2)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  sold-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> $GITHUB_ENV

      - name: Check sold properties
        run: |
          mkdir -p logs
          echo "🔍 Checking sold properties ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          python -u scripts/scheduler.py --check-sold
        timeout-minutes: 50

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sold-check-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
