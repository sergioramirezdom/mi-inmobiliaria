name: Notariado Zona Price Avg Ingestion

on:
  # Weekly, Monday at 07:00 UTC
  schedule:
    - cron: '0 7 * * 1'

  # Allow manual trigger (no inputs)
  workflow_dispatch:

jobs:
  notariado-zonas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV

      - name: Fetch notariado zona price-avg
        run: |
          mkdir -p logs
          echo "🏛️ Fetching notariado zona price-avg ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          python -u scripts/fetch_notariado_zonas.py
        timeout-minutes: 20

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notariado-zonas-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
